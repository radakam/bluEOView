services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bluEOView_backend
    ports:
      - "5000:5000"
    environment:
      - API_PORT=5000
      # Optional overrides; defaults live in backend/config.py.
      # - DATA_URL= https://data.up.ethz.ch/shared/Blueoview_data
      # - STORAGE_DIR=/var/cephaloview_data/
    working_dir: /app
    volumes:
      - ./backend/data/:/var/cephaloview_data/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bluEOView_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
